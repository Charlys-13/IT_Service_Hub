<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Service Hub</title><link rel="stylesheet" href="assets/portal.css"></head><body><header><b>IT Service Hub</b><a href="admin.html">Acceso IT →</a></header><main><section class="hero"><span>SOPORTE CENTRALIZADO</span><h1>¿Cómo podemos ayudarte?</h1><p>Registra tu incidencia y el equipo de IT podrá darle seguimiento desde cualquier equipo.</p></section><form id="ticketForm"><h2>Crear ticket de soporte</h2><div class="grid"><label>Nombre completo *<input id="requester" required></label><label>Propiedad *<select id="property" required></select></label><label>Departamento *<select id="department" required></select></label><label>Equipo / referencia<input id="asset"></label><label class="wide">Problema *<input id="problem" required></label><label class="wide">Descripción *<textarea id="description" required></textarea></label><label class="wide">Imagen inicial (opcional)<input id="openingImage" type="file" accept="image/*"><small>Máximo 8 MB; compresión automática.</small><div id="preview"></div></label></div><button id="submitButton">Crear ticket</button><p id="formMessage"></p></form></main><dialog id="success"><h2>Ticket creado</h2><strong id="folio"></strong><p>El equipo de IT ya puede consultar la solicitud.</p><button onclick="document.getElementById('success').close()">Cerrar</button></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script src="assets/portal.js"></script></body></html>
